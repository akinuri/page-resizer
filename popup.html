<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Page Resizer</title>
    <style>
      body {
        margin: 0;
        width: 200px;
        font-family: system-ui, sans-serif;
        background: #1e1e1e;
        color: #eee;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 6px;
        max-height: 320px;
        overflow-y: auto;
      }
      li + li {
        margin-top: 4px;
      }
      button {
        width: 100%;
        padding: 8px 10px;
        background: #2c2c2c;
        color: #eee;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #3a3a3a;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.active {
        border-color: #0078ff;
        background: #103a63;
      }
      .off {
        margin-top: 8px;
        border-top: 1px solid #3a3a3a;
        padding-top: 8px;
      }
      .off button {
        text-align: center;
        font-weight: 600;
      }
      #warning {
        display: none;
        margin: 6px;
        padding: 8px 10px;
        background: #4a2f10;
        border: 1px solid #8a5a1e;
        color: #ffd8a8;
        font-size: 12px;
        line-height: 1.4;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="warning"></div>
    <ul id="presets"></ul>
    <div class="off">
      <button id="off-btn">Turn Off</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
